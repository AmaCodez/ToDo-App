<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <!-- HEADER -->
         <header class="header">
            <button id="menuToggle" class="hamburger">☰</button>
            <h1 class="logo">ToDo List</h1>
         </header>

        <!-- SIDEBAR -->
        <nav class="sidebar">
            <button class="tab addTaskBtn">Add Task</button>
            <button class="tab" id="myTasks">My Tasks</button>
            <button class="tab" id="todayTask">Today</button>
            <button class="tab" id="upcomingTask">Upcoming</button>
            <button class="tab" id="completedTask">Completed</button>

            <hr> <!-- Divider -->
            <div class="projects-container">
                <p class="projects-title">Projects</p>
                <button class="projectsBtn">New Project</button>
                <div class="project-content"></div>
            </div>
        </nav>

        <!-- MAIN CONTENT -->
        <main id="content">
            <div id="task-container"></div> 
        </main>
    </div>

    <!-- PROJECT MODAL -->
    <dialog id="newProjectDialog">
        <form method="dialog">
            <label for="projectName">Project Name:</label>
            <input type="text" id="projectName" placeholder="Enter project name" required />
            <div class="dialog-buttons">
                <button type="submit" class="addProjectBtn">Add</button>
                <button type="button" class="cancelProjectBtn">Cancel</button>
            </div>
        </form>
    </dialog>

    <!-- TASK FORM MODAL -->
    <dialog id="taskDialog">
        <form action="" method="get" class="form">
            <input type="text" name="usersTaskName" placeholder="Task name..." class="form-content" id="taskName">
            <div class="form-content form-date">
                <label for="dueDate">Due date</label>
                <input id="dueDate" type="date">
            </div>
            <div class="form-content form-priority">
                <label for="priority">Priority</label>
                <select name="priority" id="priority">
                    <option value="none">None</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </div>
            <div class="form-content form-description">
                <label for="description">Task</label>
                <textarea name="description" id="description" placeholder="What is this task about?"></textarea>
            </div>
            <div class='form-buttons'>
                <button class="newTask">Add</button>
                <button class="cancel" formmethod="dialog">Cancel</button>
          </div>
        </form>
    </dialog>
</body>
</html>
